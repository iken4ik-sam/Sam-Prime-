<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sam Prime</title>
<meta name="theme-color" content="#0E1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sam Prime">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:Manrope;font-style:normal;font-weight:400;font-display:swap;src:url(fonts/manrope-cyrillic-400-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;font-style:normal;font-weight:600;font-display:swap;src:url(fonts/manrope-cyrillic-600-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;font-style:normal;font-weight:700;font-display:swap;src:url(fonts/manrope-cyrillic-700-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;font-style:normal;font-weight:800;font-display:swap;src:url(fonts/manrope-cyrillic-800-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;font-style:normal;font-weight:400;font-display:swap;src:url(fonts/manrope-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Manrope;font-style:normal;font-weight:600;font-display:swap;src:url(fonts/manrope-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Manrope;font-style:normal;font-weight:700;font-display:swap;src:url(fonts/manrope-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Manrope;font-style:normal;font-weight:800;font-display:swap;src:url(fonts/manrope-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#0E1014; --card:rgba(23,26,33,.78); --solid:#171A21; --card2:rgba(40,45,56,.7); --line:rgba(255,255,255,.09);
  --text:#F2F4F8; --muted:#8C93A3; --accent:#FF7A45;
  --fin:#E8B84A; --spi:#A08CFF; --bod:#3DD68C; --per:#4FA3FF;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--text);font-family:Manrope,system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
#bg{position:fixed;inset:0;z-index:-2;background:#0E1014 center/cover no-repeat}
#shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(14,16,20,var(--dim,.45)) 0%,rgba(14,16,20,calc(var(--dim,.45) + .25)) 100%)}
.card,.row,.goal,.sph,.empty,.chip{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.gear{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--card)}
.gear svg{width:18px;height:18px}
.quotebox{margin-top:12px;padding:16px 18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer}
.quotebox .q{font-size:16px;font-weight:600;line-height:1.45}
.quotebox .a{font-size:12px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between}
.bgopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bgopts button,.bgopts label{margin:0;aspect-ratio:3/4;border-radius:12px;border:2px solid transparent;background:#222 center/cover;display:flex;align-items:flex-end;justify-content:center;padding:6px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;cursor:pointer}
.bgopts .on{border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
button{cursor:pointer;border:0;background:none}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 96px)}
header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}
.date{color:var(--muted);font-size:13px;margin-top:2px;text-transform:capitalize}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:99px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--bod)} .sync.err i{background:#FF5D5D}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 4px 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
h2 button{font-size:12px;color:var(--accent);text-transform:none;letter-spacing:0;font-weight:600}
.card{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.hero{display:flex;gap:16px;align-items:center}
.ring{--p:0;--c:var(--accent);width:84px;height:84px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--card2) 0)}
.ring b{width:68px;height:68px;border-radius:50%;background:var(--solid);display:grid;place-items:center;font-size:20px;font-weight:800}
.hero .t{font-weight:700;font-size:17px}
.hero .s{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.4}
.streak{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:#2A1C14;color:var(--accent);font-weight:700;font-size:13px;padding:5px 10px;border-radius:99px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.row .grow{flex:1;min-width:0}
.row .ttl{font-weight:600;line-height:1.3;word-wrap:break-word}
.row .meta{font-size:12px;color:var(--muted);margin-top:3px}
.row.done .ttl{color:var(--muted);text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid var(--c,var(--muted));flex:none;display:grid;place-items:center;transition:.15s}
.chk.on{background:var(--c,var(--accent))}
.chk.on::after{content:"";width:10px;height:6px;border-left:2.5px solid #0E1014;border-bottom:2.5px solid #0E1014;transform:rotate(-45deg) translate(1px,-1px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.tag{font-size:11px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);padding:3px 8px;border-radius:99px;white-space:nowrap}
.x{color:var(--muted);font-size:18px;padding:4px 6px;line-height:1}
.x.warn{color:#FF5D5D;font-size:12px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-weight:600;font-size:13px;color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.goal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px;border-left:4px solid var(--c)}
.goal .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.goal .ttl{font-weight:700;font-size:16px;line-height:1.3}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .3s}
.goal .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.subs{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.sub{display:flex;align-items:center;gap:10px;padding:8px 0}
.sub .chk{width:22px;height:22px;border-radius:7px}
.sub span{flex:1;font-size:14px}
.sub.done span{color:var(--muted);text-decoration:line-through}
.addsub{display:flex;gap:8px;margin-top:6px}
.addsub input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
.addsub button{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:0 14px;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:22px 16px;font-size:14px;line-height:1.5;background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.empty button{margin-top:10px;color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sph{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sph .h{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:10px}
.sph .big{font-size:28px;font-weight:800;color:var(--c)}
.sph .l{font-size:12px;color:var(--muted);line-height:1.6}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-top:10px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--card2)}
.heat-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(14,16,20,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px)}
nav .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-around}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 10px;min-width:60px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--text)}
.fab{width:52px;height:52px;border-radius:17px;background:var(--accent);color:#1a0d06;display:grid;place-items:center;font-size:28px;font-weight:600;box-shadow:0 6px 20px rgba(255,122,69,.35);min-width:0!important;padding:0!important}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--solid);border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);max-width:560px;margin:0 auto;transform:translateY(105%);transition:transform .25s ease;max-height:90vh;overflow:auto}
.sheet.open{transform:none}
.grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card2);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{padding:9px 0;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--bg);color:var(--text)}
label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 6px}
.inp{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;font-size:16px}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:96px;resize:vertical}
.sphpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sphpick button{padding:11px;border-radius:12px;background:var(--card2);border:2px solid transparent;font-weight:700;font-size:14px;text-align:left}
.sphpick button.on{border-color:var(--c);color:var(--c)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.save{width:100%;margin-top:18px;background:var(--accent);color:#1a0d06;font-weight:800;padding:14px;border-radius:14px;font-size:16px}
.save:disabled{opacity:.4}
.done-toggle{width:100%;text-align:center;color:var(--muted);font-size:13px;font-weight:600;padding:10px}
.quote{color:var(--muted);font-size:13px;font-style:italic;text-align:center;margin:18px 10px 0;line-height:1.5}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div>
<div class="app">
  <header>
    <div><div style="font-size:11px;font-weight:800;letter-spacing:.22em;color:var(--accent);margin-bottom:4px">SAM PRIME</div><h1 id="title">Сегодня</h1><div class="date" id="today"></div></div>
    <div style="display:flex;gap:8px;align-items:center">
      
      <button class="gear" data-act="open-bg" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Сегодня</button>
  <button data-tab="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Цели</button>
  <button class="fab" data-act="open-add" aria-label="Добавить">+</button>
  <button data-tab="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3" stroke-linecap="round"/></svg>Задачи</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Прогресс</button>
</div></nav>

<div class="sheet-bg" id="sheetBg" data-act="close-sheet"></div>
<div class="sheet" id="sheet"></div>

<script>
const SPH = {
  fin:{name:'Финансово', icon:'💰', color:'var(--fin)'},
  spi:{name:'Духовно',   icon:'🕊️', color:'var(--spi)'},
  bod:{name:'Физически', icon:'💪', color:'var(--bod)'},
  per:{name:'Личностно', icon:'🧠', color:'var(--per)'}
};
const SPH_KEYS = Object.keys(SPH);
const KEY = 'planner4-v1';
const QUOTES = [
  ['Ты то, что ты делаешь каждый день.',''],
  ['Дисциплина — это мост между целями и достижениями.','Джим Рон'],
  ['Мы все страдаем от одной из двух болей: боли дисциплины или боли сожаления.','Джим Рон'],
  ['Мы — то, что мы постоянно делаем. Совершенство — не действие, а привычка.','Уилл Дюрант'],
  ['Дисциплина равна свободе.','Джоко Виллинк'],
  ['Мотивация помогает начать. Привычка помогает продолжать.','Джим Рюн'],
  ['Успех — это сумма небольших усилий, повторяемых изо дня в день.','Роберт Колльер'],
  ['Тот, кто побеждает других, силён. Тот, кто побеждает себя, — могуществен.','Лао-цзы'],
  ['Путь в тысячу ли начинается с первого шага.','Лао-цзы'],
  ['Неважно, как медленно ты идёшь, главное — не останавливаться.','Конфуций'],
  ['Капля долбит камень не силой, а частотой падения.','Овидий'],
  ['Первая и лучшая из побед — победа над собой.','Платон'],
  ['Никто не свободен, кто не владеет собой.','Эпиктет'],
  ['Трудности укрепляют ум, как труд укрепляет тело.','Сенека'],
  ['Пока мы откладываем жизнь, она проходит.','Сенека'],
  ['У тебя есть власть над своим умом, а не над внешними событиями. Осознай это — и обретёшь силу.','Марк Аврелий'],
  ['Хватит рассуждать о том, каким должен быть хороший человек. Будь им.','Марк Аврелий'],
  ['Победи себя — и выиграешь тысячу битв.','Дхаммапада'],
  ['Кто не может повелевать себе, тот должен повиноваться.','Фридрих Ницше'],
  ['Привычка — вторая натура.','Цицерон'],
  ['Тяжело в учении — легко в бою.','А. В. Суворов'],
  ['Делай что можешь, с тем, что имеешь, там, где ты есть.','Теодор Рузвельт'],
  ['Начни делать то, что нужно. Затем — что возможно. И вдруг обнаружишь, что делаешь невозможное.','Франциск Ассизский'],
  ['Не жди. Время никогда не будет «подходящим».','Наполеон Хилл'],
  ['Лучшее время посадить дерево было 20 лет назад. Следующее лучшее время — сегодня.','Китайская пословица'],
  ['Терпение и труд всё перетрут.','Русская пословица'],
  ['Сначала мы формируем привычки, а потом привычки формируют нас.',''],
  ['Дисциплина — это выбор между тем, чего хочешь сейчас, и тем, чего хочешь больше всего.',''],
  ['Сила не в том, чтобы никогда не падать, а в том, чтобы вставать каждый раз.',''],
  ['Кто хочет — ищет возможности. Кто не хочет — ищет причины.',''],
  ['Не жди мотивации. Начни — и она придёт.',''],
  ['Маленький шаг каждый день сильнее большого рывка раз в месяц.',''],
  ['Сегодняшний ты строит завтрашнего себя.',''],
  ['Сделанное лучше идеального.',''],
  ['Мастер когда-то тоже был новичком.',''],
  ['Не откладывай на завтра то, что можно сделать сегодня.',''],
  ['Утро определяет весь день.',''],
  ['Сила воли — как мышца: чем чаще тренируешь, тем она сильнее.',''],
  ['Чувства приходят и уходят. Дисциплина остаётся.',''],
  ['Ты не обязан хотеть. Ты обязан сделать.',''],
  ['Сравнивай себя только с тем, кем ты был вчера.',''],
  ['Трудно — не значит невозможно.',''],
  ['Каждый выполненный пункт — голос за того, кем ты хочешь стать.',''],
  ['Результат любит тишину и регулярность.','']
];
let quoteIdx = Math.floor(Math.random()*QUOTES.length);

const z = n => String(n).padStart(2,'0');
const dk = (d=new Date()) => d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = s => { if(!s) return ''; const [y,m,d]=s.split('-'); return new Date(+y,+m-1,+d).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}); };
const plural = (n,a,b,c) => { const m=n%10, h=n%100; return (m===1&&h!==11)?a:(m>=2&&m<=4&&(h<10||h>=20))?b:c; };

function blank(){ return {v:1, updatedAt:0, goals:[], tasks:[], habits:[], log:{}}; }
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.v) return s; }catch(e){} return blank(); }
let state = load();
let ui = {tab:'today', goalFilter:'all', open:{}, showDone:false, confirm:null, editHabits:false};
let form = null;

/* ---------- persistence ---------- */
let dbRef=null, writing=false, pending=false, saveTimer=null;
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function commit(){
  state.updatedAt = Date.now();
  // trim old log entries (keep ~1 year)
  const cut = dk(addDays(new Date(), -400));
  for (const d in state.log) if (d < cut) delete state.log[d];
  saveLocal(); render();
  clearTimeout(saveTimer); saveTimer = setTimeout(push, 700);
}
async function push(){
  if(!dbRef) return;
  if(writing){ pending=true; return; }
  writing=true;
  try{ await dbRef.set(JSON.parse(JSON.stringify(state))); setSync('ok'); }
  catch(e){ setSync(e && e.code==='invalid_argument' ? 'local' : 'err'); if(e && e.code==='invalid_argument') dbRef=null; }
  writing=false;
  if(pending){ pending=false; push(); }
}
function setSync(s){
  const el=document.getElementById('sync'); if(!el) return;
  el.className='sync '+(s==='ok'?'ok':s==='err'?'err':'');
  el.querySelector('span').textContent = s==='ok'?'облако':s==='err'?'нет связи':s==='wait'?'ожидание':'на устройстве';
}
(async () => {
  try{
    if(!window.claude || !claude.use){ setSync('local'); return; }
    const [user, db] = await Promise.all([claude.use('user'), claude.use('db')]);
    if(!user || !db){ setSync('local'); return; }
    const id = await user.id();
    if(!id){ setSync('local'); return; }
    dbRef = db.doc('data/users/'+id+'/planner');
    bgRef = db.doc('data/users/'+id+'/background');
    bgRef.get().then(s => {
      const r = s.exists ? s.data() : null;
      if(r && (r.updatedAt||0) > (bgState.updatedAt||0)){ bgState={...r}; try{localStorage.setItem(BGKEY,JSON.stringify(bgState));}catch(e){} applyBg(); }
      else if(bgState.updatedAt && (!r || (r.updatedAt||0) < bgState.updatedAt)){ bgRef.set({...bgState}).catch(()=>{}); }
    }).catch(()=>{});
    const timer = setTimeout(()=>setSync('wait'), 10000);
    dbRef.onSnapshot(snap => {
      if(!snap.metadata.fromCache) clearTimeout(timer);
      if(snap.metadata.hasPendingWrites) return;
      const r = snap.exists ? snap.data() : null;
      if(r && r.v && (r.updatedAt||0) > (state.updatedAt||0)){
        state = JSON.parse(JSON.stringify(r)); saveLocal(); render();
      } else if(!snap.metadata.fromCache && state.updatedAt && (!r || (r.updatedAt||0) < state.updatedAt)){
        clearTimeout(saveTimer); saveTimer = setTimeout(push, 300);
      }
      if(!snap.metadata.fromCache) setSync('ok');
    }, () => { clearTimeout(timer); dbRef=null; setSync('local'); });
  }catch(e){ setSync('local'); }
})();

/* ---------- calculations ---------- */
const goalPct = g => g.subs.length ? g.subs.filter(s=>s.done).length / g.subs.length : (g.done?1:0);
const isGoalDone = g => g.subs.length ? g.subs.every(s=>s.done) : !!g.done;
function dayFrac(d){
  const n = state.habits.length; if(!n) return 0;
  const ids = new Set(state.log[d]||[]);
  return state.habits.filter(h=>ids.has(h.id)).length / n;
}
function streak(){
  if(!state.habits.length) return 0;
  let d = new Date(), s = 0;
  if(dayFrac(dk(d)) < .8) d = addDays(d,-1);
  while(dayFrac(dk(d)) >= .8){ s++; d = addDays(d,-1); }
  return s;
}
function sphereStats(k){
  const goals = state.goals.filter(g=>g.sphere===k);
  const active = goals.filter(g=>!isGoalDone(g));
  const avg = goals.length ? goals.reduce((a,g)=>a+goalPct(g),0)/goals.length : 0;
  const hab = state.habits.filter(h=>h.sphere===k);
  let hit=0;
  for(let i=0;i<7;i++){ const ids=new Set(state.log[dk(addDays(new Date(),-i))]||[]); hit += hab.filter(h=>ids.has(h.id)).length; }
  return {
    goals: goals.length, active: active.length, achieved: goals.length-active.length, avg,
    tasksDone: state.tasks.filter(t=>t.sphere===k && t.done).length,
    tasksOpen: state.tasks.filter(t=>t.sphere===k && !t.done).length,
    habits: hab.length, week: hab.length ? hit/(hab.length*7) : null
  };
}

/* ---------- render ---------- */
const view = document.getElementById('view');
function tag(k){ return `<span class="tag" style="--c:${SPH[k].color}">${SPH[k].icon} ${SPH[k].name}</span>`; }
function delBtn(id){ return ui.confirm===id ? `<button class="x warn" data-act="del" data-id="${id}">Удалить?</button>` : `<button class="x" data-act="ask" data-id="${id}" aria-label="Удалить">×</button>`; }

function taskRow(t){
  const today = dk(); const over = t.date && t.date < today && !t.done;
  const when = t.date ? (t.date===today?'сегодня':over?'просрочено · '+fmtDate(t.date):fmtDate(t.date)) : '';
  return `<div class="row ${t.done?'done':''}" style="--c:${SPH[t.sphere].color}">
    <button class="chk ${t.done?'on':''}" data-act="task" data-id="${t.id}" aria-label="Выполнено"></button>
    <div class="grow"><div class="ttl">${esc(t.title)}</div>
    <div class="meta" ${over?'style="color:#FF7A7A"':''}>${SPH[t.sphere].icon} ${SPH[t.sphere].name}${when?' · '+when:''}</div></div>
    ${delBtn(t.id)}</div>`;
}

function renderToday(){
  const d = dk(); const ids = new Set(state.log[d]||[]);
  const hDone = state.habits.filter(h=>ids.has(h.id)).length;
  const todays = state.tasks.filter(t=>!t.done && (!t.date || t.date<=d));
  const doneToday = state.tasks.filter(t=>t.done && t.doneAt===d);
  const total = state.habits.length + todays.length + doneToday.length;
  const done = hDone + doneToday.length;
  const pct = total ? Math.round(done/total*100) : 0;
  const st = streak();
  let msg = !total ? 'Добавь ритуалы и задачи — и начни свою серию.' :
    pct===100 ? 'Всё выполнено. Так и выглядит дисциплина 🔥' :
    `Выполнено ${done} из ${total}. Ещё немного!`;
  const [qt, qa] = QUOTES[quoteIdx];
  let h = `<div class="quotebox" data-act="next-quote" style="margin:0 0 12px"><div class="q">«${esc(qt)}»</div>
    <div class="a"><span>${qa?'— '+esc(qa):''}</span><span>↻ ещё</span></div></div>`;
  h += `<div class="card hero"><div class="ring" style="--p:${pct}"><b>${pct}%</b></div>
    <div><div class="t">День дисциплины</div><div class="s">${msg}</div>
    ${st?`<div class="streak">🔥 ${st} ${plural(st,'день','дня','дней')} подряд</div>`:''}</div></div>`;

  h += `<h2>Ежедневные ритуалы ${state.habits.length?`<button data-act="edit-habits">${ui.editHabits?'Готово':'Изменить'}</button>`:''}</h2>`;
  if(!state.habits.length){
    h += `<div class="empty">Ритуалы — это то, что ты делаешь каждый день: зарядка, чтение, учёт расходов, молитва или медитация.<br><button data-act="open-add" data-type="habit">+ Добавить ритуал</button></div>`;
  } else {
    for(const k of SPH_KEYS){
      for(const hb of state.habits.filter(x=>x.sphere===k)){
        const on = ids.has(hb.id);
        h += `<div class="row ${on?'done':''}" style="--c:${SPH[k].color}">
          <button class="chk ${on?'on':''}" data-act="habit" data-id="${hb.id}" aria-label="Отметить"></button>
          <div class="grow"><div class="ttl">${esc(hb.title)}</div><div class="meta">${SPH[k].icon} ${SPH[k].name}</div></div>
          ${ui.editHabits?delBtn(hb.id):''}</div>`;
      }
    }
  }

  h += `<h2>Задачи на сегодня</h2>`;
  if(!todays.length && !doneToday.length) h += `<div class="empty">Нет задач на сегодня.<br><button data-act="open-add" data-type="task">+ Добавить задачу</button></div>`;
  else h += todays.sort((a,b)=>(a.date||'9')>(b.date||'9')?1:-1).map(taskRow).join('') + doneToday.map(taskRow).join('');

  const nearGoals = state.goals.filter(g=>!isGoalDone(g)).slice(0,3);
  if(nearGoals.length){
    h += `<h2>Цели в работе <button data-act="tab" data-tab="goals">Все</button></h2>`;
    h += nearGoals.map(g=>{ const p=Math.round(goalPct(g)*100); return `<div class="row" style="--c:${SPH[g.sphere].color}" data-act="goto-goal" data-id="${g.id}">
      <span class="dot"></span><div class="grow"><div class="ttl">${esc(g.title)}</div>
      <div class="bar" style="margin:8px 0 0"><i style="width:${p}%"></i></div></div><b style="color:${SPH[g.sphere].color}">${p}%</b></div>`; }).join('');
  }
  if(!state.goals.length && !state.tasks.length && !state.habits.length)
    h += `<div style="text-align:center;margin-top:14px"><button class="chip" data-act="examples">Заполнить примерами</button></div>`;
  return h;
}

function renderGoals(){
  let h = `<div class="chips"><button class="chip ${ui.goalFilter==='all'?'on':''}" data-act="filter" data-f="all">Все</button>` +
    SPH_KEYS.map(k=>`<button class="chip ${ui.goalFilter===k?'on':''}" data-act="filter" data-f="${k}">${SPH[k].icon} ${SPH[k].name}</button>`).join('') + `</div>`;
  const list = state.goals.filter(g=>ui.goalFilter==='all'||g.sphere===ui.goalFilter)
    .sort((a,b)=>isGoalDone(a)-isGoalDone(b));
  if(!list.length) return h + `<div class="empty" style="margin-top:12px">Долгосрочная цель — например, «Накопить подушку безопасности» или «Пробежать 10 км». Раздели её на подцели и отмечай шаги.<br><button data-act="open-add" data-type="goal">+ Новая цель</button></div>`;
  h += '<div style="margin-top:12px">';
  for(const g of list){
    const p = Math.round(goalPct(g)*100), done = isGoalDone(g), open = ui.open[g.id];
    const sd = g.subs.filter(s=>s.done).length;
    let dl = '';
    if(g.deadline){ const days = Math.ceil((new Date(g.deadline)-new Date(dk()))/864e5); dl = done?'':days<0?' · срок прошёл':` · ${days} ${plural(days,'день','дня','дней')} до срока`; }
    h += `<div class="goal" id="g-${g.id}" style="--c:${SPH[g.sphere].color}">
      <div class="top"><div data-act="toggle-goal" data-id="${g.id}" style="flex:1;cursor:pointer">
        <div style="margin-bottom:6px">${tag(g.sphere)}</div>
        <div class="ttl">${done?'🏆 ':''}${esc(g.title)}</div></div>
        ${delBtn(g.id)}</div>
      <div class="bar"><i style="width:${p}%"></i></div>
      <div class="meta"><span>${g.subs.length?`${sd} из ${g.subs.length} подцелей`:done?'Достигнута':'Без подцелей'}${dl}</span><b style="color:${SPH[g.sphere].color}">${p}%</b></div>`;
    if(open){
      h += `<div class="subs">`;
      if(!g.subs.length) h += `<div class="sub ${g.done?'done':''}" style="--c:${SPH[g.sphere].color}"><button class="chk ${g.done?'on':''}" data-act="goal-done" data-id="${g.id}"></button><span>Цель достигнута</span></div>`;
      for(const s of g.subs) h += `<div class="sub ${s.done?'done':''}" style="--c:${SPH[g.sphere].color}">
        <button class="chk ${s.done?'on':''}" data-act="sub" data-g="${g.id}" data-id="${s.id}"></button><span>${esc(s.title)}</span>
        ${ui.confirm===s.id?`<button class="x warn" data-act="del-sub" data-g="${g.id}" data-id="${s.id}">Удалить?</button>`:`<button class="x" data-act="ask" data-id="${s.id}">×</button>`}</div>`;
      h += `<form class="addsub" data-g="${g.id}"><input placeholder="Новая подцель…" maxlength="120"><button>+</button></form></div>`;
    } else {
      h += `<div class="hint" data-act="toggle-goal" data-id="${g.id}" style="cursor:pointer;margin-top:10px">Открыть подцели ▾</div>`;
    }
    h += `</div>`;
  }
  return h + '</div>';
}

function renderTasks(){
  const open = state.tasks.filter(t=>!t.done).sort((a,b)=>(a.date||'9999')>(b.date||'9999')?1:-1);
  const done = state.tasks.filter(t=>t.done).sort((a,b)=>(b.doneAt||'')>(a.doneAt||'')?1:-1);
  let h = '';
  if(!open.length && !done.length) return `<div class="empty">Разовые дела — «Починить кран», «Оплатить налог», «Записаться к стоматологу». Сделал — отметил, и оно ушло в историю.<br><button data-act="open-add" data-type="task">+ Новая задача</button></div>`;
  h += `<h2 style="margin-top:4px">Активные · ${open.length}</h2>`;
  h += open.length ? open.map(taskRow).join('') : `<div class="empty">Все задачи сделаны 🎉</div>`;
  if(done.length){
    h += `<button class="done-toggle" data-act="show-done">${ui.showDone?'Скрыть':'Показать'} выполненные (${done.length})</button>`;
    if(ui.showDone) h += done.map(taskRow).join('');
  }
  return h;
}

function renderStats(){
  const st = streak();
  let best = 0, cur = 0;
  for(let i=365;i>=0;i--){ if(dayFrac(dk(addDays(new Date(),-i)))>=.8){cur++; best=Math.max(best,cur);} else cur=0; }
  const totalGoals = state.goals.length, achieved = state.goals.filter(isGoalDone).length;
  let h = `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">
    <div><div style="font-weight:700">Серия дисциплины</div><div class="hint">День засчитан, если выполнено ≥80% ритуалов</div></div>
    <div style="text-align:right"><div style="font-size:30px;font-weight:800;color:var(--accent)">🔥 ${st}</div><div class="hint">рекорд: ${best}</div></div></div>
    <div class="heat">`;
  for(let i=13;i>=0;i--){ const f=dayFrac(dk(addDays(new Date(),-i))); h += `<i style="background:${f?`color-mix(in srgb,var(--accent) ${Math.round(25+f*75)}%,var(--card2))`:'var(--card2)'}" title="${Math.round(f*100)}%"></i>`; }
  h += `</div><div class="heat-l"><span>2 недели назад</span><span>сегодня</span></div></div>`;
  h += `<h2>По сферам</h2><div class="grid">`;
  for(const k of SPH_KEYS){
    const s = sphereStats(k);
    h += `<div class="sph" style="--c:${SPH[k].color}"><div class="h">${SPH[k].icon} ${SPH[k].name}</div>
      <div class="big">${Math.round(s.avg*100)}%</div><div class="l">средний прогресс целей</div>
      <div class="bar" style="margin:8px 0"><i style="width:${Math.round(s.avg*100)}%"></i></div>
      <div class="l">Цели: ${s.active} в работе · ${s.achieved} 🏆<br>Задачи: ${s.tasksDone} сделано · ${s.tasksOpen} осталось<br>
      Ритуалы за 7 дн.: ${s.week===null?'—':Math.round(s.week*100)+'%'}</div></div>`;
  }
  h += `</div><h2>Итого</h2><div class="card" style="display:flex;justify-content:space-around;text-align:center">
    <div><div style="font-size:24px;font-weight:800">${achieved}/${totalGoals}</div><div class="hint">целей достигнуто</div></div>
    <div><div style="font-size:24px;font-weight:800">${state.tasks.filter(t=>t.done).length}</div><div class="hint">задач закрыто</div></div>
    <div><div style="font-size:24px;font-weight:800">${Object.values(state.log).reduce((a,x)=>a+x.length,0)}</div><div class="hint">отметок ритуалов</div></div></div>`;
  return h;
}

const TITLES = {today:'Сегодня', goals:'Цели', tasks:'Задачи', stats:'Прогресс'};

  const rnd=()=>{ s=(s*9301+49297)%233280; return s/233280; };

    embers+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="#FF8A3D" opacity="${o.toFixed(2)}"/>`; }
  let stars=''; for(let i=0;i<90;i++){ stars+=`<circle cx="${(rnd()*900).toFixed(1)}" cy="${(rnd()*700).toFixed(1)}" r="${(.4+rnd()*1.1).toFixed(2)}" fill="#fff" opacity="${(.2+rnd()*.6).toFixed(2)}"/>`; }
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
   <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07080C"/><stop offset=".45" stop-color="#151622"/><stop offset=".72" stop-color="#3A1A14"/><stop offset="1" stop-color="#0A0607"/></linearGradient>
   <radialGradient id="moon" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F3E6D0"/><stop offset=".7" stop-color="#D9C3A2"/><stop offset="1" stop-color="#B89A76"/></radialGradient>
   <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD9A8" stop-opacity=".35"/><stop offset="1" stop-color="#FFD9A8" stop-opacity="0"/></radialGradient>
   <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A2A1C" stop-opacity="0"/><stop offset="1" stop-color="#5A2A1C" stop-opacity=".55"/></linearGradient>
  </defs>
  <rect width="900" height="1600" fill="url(#sky)"/>${stars}
  <circle cx="610" cy="560" r="330" fill="url(#halo)"/>
  <circle cx="610" cy="560" r="170" fill="url(#moon)"/>
  <circle cx="560" cy="520" r="26" fill="#C9AE8A" opacity=".5"/><circle cx="660" cy="610" r="38" fill="#C9AE8A" opacity=".4"/><circle cx="640" cy="490" r="14" fill="#C9AE8A" opacity=".5"/>
  <path d="M0 900 L120 760 L210 820 L330 650 L430 780 L520 700 L640 840 L760 720 L900 820 V1600 H0Z" fill="#1A1218"/>
  <rect y="760" width="900" height="300" fill="url(#fog)"/>
  <path d="M0 1050 L90 960 L180 1010 L290 880 L380 980 L470 930 L560 1040 L700 920 L820 1000 L900 950 V1600 H0Z" fill="#110C10"/>
  <path d="M0 1230 L140 1120 L250 1170 L340 1080 L470 1200 L600 1110 L720 1190 L900 1100 V1600 H0Z" fill="#0A0709"/>
  <path d="M0 1600 V1330 L60 1310 L130 1240 L170 1250 L210 1180 L250 1230 L330 1290 L900 1360 V1600Z" fill="#050405"/>
  ${embers}</svg>`;
  return 'url("data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)+'")';
}
const BGKEY='planner4-bg';
let bgState = (()=>{ try{ return JSON.parse(localStorage.getItem(BGKEY))||{mode:'scene',img:'',dim:.45,updatedAt:0}; }catch(e){ return {mode:'scene',img:'',dim:.45,updatedAt:0}; } })();
let bgRef=null, bgWriting=false;
function applyBg(){
  const el=document.getElementById('bg');
  el.style.backgroundImage = bgState.mode==='custom'&&bgState.img ? `url("${bgState.img}")` : bgState.mode==='scene' ? sceneSVG() : 'none';
  document.documentElement.style.setProperty('--dim', bgState.mode==='none'?0:bgState.dim);
}
async function saveBg(){
  bgState.updatedAt=Date.now();
  try{ localStorage.setItem(BGKEY, JSON.stringify(bgState)); }catch(e){}
  applyBg();
  if(!bgRef || bgWriting) return;
  bgWriting=true; try{ await bgRef.set({...bgState}); }catch(e){} bgWriting=false;
}
function shrinkImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      let w=img.naturalWidth, h=img.naturalHeight, max=1100;
      for(let attempt=0; attempt<6; attempt++){
        const k=Math.min(1, max/Math.max(w,h)); const c=document.createElement('canvas');
        c.width=Math.round(w*k); c.height=Math.round(h*k);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        const out=c.toDataURL('image/jpeg', .72);
        if(out.length < 230000 || attempt===5){ URL.revokeObjectURL(url); return res(out); }
        max=Math.round(max*.8);
      }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(); };
    img.src=url;
  });
}

      <label class="${bgState.mode==='custom'?'on':''}" style="${bgState.img?`background-image:url('${bgState.img}')`:'background:var(--card2)'}">
        <input type="file" accept="image/*" id="bgfile" hidden>${bgState.img?'Моё фото':'＋ Своё фото'}</label>
      <button data-act="bg-mode" data-m="none" class="${bgState.mode==='none'?'on':''}" style="background:#0E1014">Без фона</button>
    </div>
    <div class="hint" id="bgmsg">Выбери любую картинку из галереи — она сохранится в телефоне.</div>
    <label>Затемнение — чтобы текст читался</label>
    <input type="range" id="bgdim" min="0" max="0.75" step="0.05" value="${bgState.dim}">
    <div style="font-weight:800;font-size:18px;margin:22px 0 6px">Резервная копия</div>
    <div class="hint">Все данные хранятся только в этом телефоне. Раз в неделю сохраняй копию — она пригодится при смене телефона или очистке браузера.</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
      <button class="chip" data-act="export" style="padding:12px;color:var(--text)">⬇ Сохранить копию</button>
      <label class="chip" style="padding:12px;margin:0;text-align:center;color:var(--text);cursor:pointer">⬆ Восстановить<input type="file" accept=".json,application/json" id="importfile" hidden></label>
    </div>
    <div class="hint" id="bkmsg">${state.lastBackup?'Последняя копия: '+fmtDate(state.lastBackup):'Копий ещё не было.'}</div>
    <button class="save" data-act="close-sheet">Готово</button>`;
  sheet.classList.add('open'); sheetBg.classList.add('open');
}
document.addEventListener('change', async e => {
  if(e.target.id==='bgfile' && e.target.files[0]){
    const msg=document.getElementById('bgmsg'); msg.textContent='Обрабатываю картинку…';
    try{ bgState.img = await shrinkImage(e.target.files[0]); bgState.mode='custom'; await saveBg(); openBgSheet(); }
    catch(err){ msg.textContent='Не получилось открыть эту картинку. Попробуй другую (JPG или PNG).'; }
  }
});
document.addEventListener('input', e => {
  if(e.target.id==='bgdim'){ bgState.dim=+e.target.value; applyBg(); clearTimeout(window._dimT); window._dimT=setTimeout(saveBg,600); }
});
applyBg();

/* ---------- add sheet ---------- */
const sheet = document.getElementById('sheet'), sheetBg = document.getElementById('sheetBg');
function openSheet(type){
  const def = {today:'task', goals:'goal', tasks:'task', stats:'goal'}[ui.tab];
  form = {type:type||def, title:'', sphere: ui.tab==='goals'&&ui.goalFilter!=='all'?ui.goalFilter:'per', date: '', subs:''};
  if(form.type==='task' && ui.tab==='today') form.date = dk();
  renderSheet(); sheet.classList.add('open'); sheetBg.classList.add('open');
  setTimeout(()=>{ const i=sheet.querySelector('#f-title'); i&&i.focus(); }, 260);
}
function closeSheet(){ sheet.classList.remove('open'); sheetBg.classList.remove('open'); form=null; }
function renderSheet(){
  const f = form, T = {goal:'Цель', task:'Задача', habit:'Ритуал'};
  const ph = {goal:'Например: накопить 500 000 ₸', task:'Например: починить кран', habit:'Например: 20 минут чтения'};
  let h = `<div class="grab"></div><div class="seg">${Object.keys(T).map(t=>`<button data-act="ftype" data-t="${t}" class="${f.type===t?'on':''}">${T[t]}</button>`).join('')}</div>
    <div class="hint" style="margin:-6px 2px 4px">${f.type==='goal'?'Долгосрочная цель, которую можно разбить на шаги.':f.type==='task'?'Разовое дело: сделал — и готово.':'Повторяется каждый день и строит серию дисциплины.'}</div>
    <label>Название</label><input class="inp" id="f-title" maxlength="140" placeholder="${ph[f.type]}" value="${esc(f.title)}">
    <label>Сфера</label><div class="sphpick">${SPH_KEYS.map(k=>`<button data-act="fsph" data-k="${k}" class="${f.sphere===k?'on':''}" style="--c:${SPH[k].color}">${SPH[k].icon} ${SPH[k].name}</button>`).join('')}</div>`;
  if(f.type==='goal') h += `<label>Срок (необязательно)</label><input class="inp" type="date" id="f-date" value="${f.date}">
    <label>Подцели — каждая с новой строки</label><textarea class="inp" id="f-subs" placeholder="Открыть накопительный счёт&#10;Откладывать 10% с каждого дохода&#10;Собрать первые 100 000 ₸">${esc(f.subs)}</textarea>`;
  if(f.type==='task') h += `<label>Дата (необязательно)</label><input class="inp" type="date" id="f-date" value="${f.date}">
    <div class="hint">Без даты задача всегда будет видна на экране «Сегодня».</div>`;
  h += `<button class="save" data-act="save">Добавить</button>`;
  sheet.innerHTML = h;
}
function readForm(){
  const t=sheet.querySelector('#f-title'), d=sheet.querySelector('#f-date'), s=sheet.querySelector('#f-subs');
  if(t) form.title=t.value; if(d) form.date=d.value; if(s) form.subs=s.value;
}
function saveForm(){
  readForm();
  const title = form.title.trim();
  if(!title){ const i=sheet.querySelector('#f-title'); i.style.borderColor='#FF5D5D'; i.focus(); return; }
  if(form.type==='goal'){
    const subs = form.subs.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>({id:uid(), title:x, done:false}));
    const g = {id:uid(), sphere:form.sphere, title, deadline:form.date||'', subs, done:false, created:dk()};
    state.goals.unshift(g); ui.open[g.id]=true; ui.tab='goals';
  } else if(form.type==='task'){
    state.tasks.push({id:uid(), sphere:form.sphere, title, date:form.date||'', done:false});
    if(ui.tab!=='today') ui.tab='tasks';
  } else {
    state.habits.push({id:uid(), sphere:form.sphere, title}); ui.tab='today';
  }
  closeSheet(); commit();
}

/* ---------- actions ---------- */
function findGoal(id){ return state.goals.find(g=>g.id===id); }
function remove(id){
  state.goals = state.goals.filter(x=>x.id!==id);
  state.tasks = state.tasks.filter(x=>x.id!==id);
  if(state.habits.some(x=>x.id===id)){
    state.habits = state.habits.filter(x=>x.id!==id);
    for(const d in state.log) state.log[d] = state.log[d].filter(x=>x!==id);
  }
}
function examples(){
  const S=(t)=>({id:uid(), title:t, done:false});
  state.habits = [
    {id:uid(), sphere:'bod', title:'Зарядка 15 минут'},
    {id:uid(), sphere:'spi', title:'10 минут тишины / молитвы'},
    {id:uid(), sphere:'per', title:'Читать 20 страниц'},
    {id:uid(), sphere:'fin', title:'Записать расходы за день'}];
  state.goals = [
    {id:uid(), sphere:'fin', title:'Создать финансовую подушку', deadline:'', subs:[S('Посчитать расходы за месяц'),S('Открыть накопительный счёт'),S('Откладывать 10% дохода 3 месяца')], done:false, created:dk()},
    {id:uid(), sphere:'bod', title:'Пробежать 5 км без остановки', deadline:'', subs:[S('Купить кроссовки'),S('Бегать 3 раза в неделю'),S('Пробежать 3 км'),S('Пробежать 5 км')], done:false, created:dk()},
    {id:uid(), sphere:'per', title:'Запустить YouTube-канал', deadline:'', subs:[S('Придумать концепцию'),S('Снять первое видео'),S('Выложить 10 видео')], done:false, created:dk()}];
  state.tasks = [{id:uid(), sphere:'per', title:'Починить кран', date:dk(), done:false}];
  commit();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-tab]'); if(!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if(!a && b.dataset.tab){ ui.tab=b.dataset.tab; ui.confirm=null; ui.editHabits=false; render(); window.scrollTo(0,0); return; }
  if(a!=='del' && a!=='del-sub' && a!=='ask') ui.confirm=null;
  switch(a){
    case 'tab': ui.tab=b.dataset.tab; render(); window.scrollTo(0,0); break;
    case 'open-add': openSheet(b.dataset.type); break;
    case 'close-sheet': closeSheet(); break;
    case 'ftype': readForm(); form.type=b.dataset.t; if(form.type!=='task'&&form.type!=='goal') form.date=''; renderSheet(); break;
    case 'fsph': readForm(); form.sphere=b.dataset.k; renderSheet(); break;
    case 'save': saveForm(); break;
    case 'habit': { const d=dk(); const l=new Set(state.log[d]||[]); l.has(id)?l.delete(id):l.add(id); state.log[d]=[...l]; commit(); break; }
    case 'task': { const t=state.tasks.find(x=>x.id===id); t.done=!t.done; t.doneAt=t.done?dk():''; commit(); break; }
    case 'sub': { const g=findGoal(b.dataset.g); const s=g.subs.find(x=>x.id===id); s.done=!s.done; commit(); break; }
    case 'goal-done': { const g=findGoal(id); g.done=!g.done; commit(); break; }
    case 'toggle-goal': ui.open[id]=!ui.open[id]; render(); break;
    case 'goto-goal': ui.tab='goals'; ui.goalFilter='all'; ui.open[id]=true; render(); setTimeout(()=>{const el=document.getElementById('g-'+id); el&&el.scrollIntoView({block:'center'});},30); break;
    case 'filter': ui.goalFilter=b.dataset.f; render(); break;
    case 'show-done': ui.showDone=!ui.showDone; render(); break;
    case 'edit-habits': ui.editHabits=!ui.editHabits; render(); break;
    case 'ask': ui.confirm=id; render(); break;
    case 'del': remove(id); ui.confirm=null; commit(); break;
    case 'del-sub': { const g=findGoal(b.dataset.g); g.subs=g.subs.filter(x=>x.id!==id); ui.confirm=null; commit(); break; }
    case 'examples': examples(); break;
    case 'next-quote': { let n; do{ n=Math.floor(Math.random()*QUOTES.length); }while(n===quoteIdx && QUOTES.length>1); quoteIdx=n; render(); break; }
    case 'open-bg': openBgSheet(); break;
    case 'bg-mode': bgState.mode=b.dataset.m; saveBg(); openBgSheet(); break;
    case 'export': exportBackup(); break;
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('.addsub'); if(!f) return;
  e.preventDefault();
  const inp = f.querySelector('input'), v = inp.value.trim(); if(!v) return;
  const g = findGoal(f.dataset.g); g.subs.push({id:uid(), title:v, done:false}); g.done=false;
  commit();
  const ni = document.querySelector(`.addsub[data-g="${g.id}"] input`); ni && ni.focus();
});
document.addEventListener('keydown', e => {
  if(e.key==='Enter' && form && e.target.id==='f-title'){ e.preventDefault(); saveForm(); }
  if(e.key==='Escape' && form) closeSheet();
});

document.getElementById('today').textContent = new Date().toLocaleDateString('ru-RU',{weekday:'long', day:'numeric', month:'long'});
render();

/* ---------- offline: backup + service worker ---------- */
function exportBackup(){
  state.lastBackup = dk(); commit();
  const data = JSON.stringify({app:'sam-prime', version:1, exported:new Date().toISOString(), state, background:bgState});
  const blob = new Blob([data], {type:'application/json'});
  const name = 'sam-prime-' + dk() + '.json';
  const file = new File([blob], name, {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:'Sam Prime — копия'}).catch(()=>{});
  } else {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  const m = document.getElementById('bkmsg'); if(m) m.textContent = 'Копия сохранена: ' + fmtDate(dk());
}
document.addEventListener('change', async e => {
  if(e.target.id !== 'importfile' || !e.target.files[0]) return;
  const m = document.getElementById('bkmsg');
  try{
    const obj = JSON.parse(await e.target.files[0].text());
    if(obj.app !== 'sam-prime' || !obj.state || !obj.state.v) throw 0;
    state = obj.state; commit();
    if(obj.background){ bgState = obj.background; saveBg(); }
    if(m) m.textContent = 'Данные восстановлены ✓';
  }catch(err){ if(m) m.textContent = 'Это не файл копии Sam Prime.'; }
});
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
</script>
</body>
